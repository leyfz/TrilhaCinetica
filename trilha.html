<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Academia (Com Supabase)</title>
    <!-- Importando a biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f3f4f6; display: flex; justify-content: center; padding: 20px; }
        .cartao { background-color: white; width: 100%; max-width: 400px; border-radius: 16px; padding: 30px 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-top: 20px; }
        h1 { text-align: center; color: #1f2937; margin-bottom: 20px; }
        
        .painel-lotacao { background-color: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 30px; }
        .painel-lotacao p { color: #3b82f6; font-weight: bold; font-size: 14px; text-transform: uppercase; margin-bottom: 5px; }
        .numero-lotacao { font-size: 48px; font-weight: 900; color: #1d4ed8; }

        .btn { width: 100%; padding: 25px; border: none; border-radius: 12px; font-size: 20px; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-entrar { background-color: #22c55e; }
        .btn-sair { background-color: #ef4444; display: none; }
    </style>
</head>
<body>

    <div class="cartao">
        <h1>Controle de Treino</h1>

        <div class="painel-lotacao">
            <p>Pessoas treinando agora</p>
            <div id="contadorPessoas" class="numero-lotacao">...</div>
        </div>

        <button id="btnEntrar" class="btn btn-entrar">FAZER CHECK-IN</button>
        <button id="btnSair" class="btn btn-sair">ENCERRAR TREINO</button>
    </div>

    <script>
        // 1. DADOS DE CONEXÃO REAIS
        // Usei o formato correto da URL (.supabase.co) e a sua chave exata:
        const SUPABASE_URL = 'https://mhnumaqrqthfmrmbqzmv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1obnVtYXFycXRoZm1ybWJxem12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NzA2MTcsImV4cCI6MjEwMzI0NjYxN30.Z1s8rza-9KsfJ2gdnx1U1-J3m84mLHewhnQETzry5-4';

        // Iniciando o banco de dados
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. IDENTIFICAÇÃO DO USUÁRIO
        let meuDispositivoId = localStorage.getItem('dispositivoId');
        if (!meuDispositivoId) {
            meuDispositivoId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('dispositivoId', meuDispositivoId);
        }

        const btnEntrar = document.getElementById('btnEntrar');
        const btnSair = document.getElementById('btnSair');
        const contadorPessoas = document.getElementById('contadorPessoas');

        // 3. BUSCANDO OS DADOS
        async function carregarDados() {
            try {
                // Conta as pessoas
                const { count, error: erroContagem } = await supabase
                    .from('check_ins')
                    .select('*', { count: 'exact', head: true })
                    .eq('status', 'ACTIVE');
                
                if (erroContagem) throw erroContagem;
                
                contadorPessoas.innerText = count || 0;

                // Verifica status do usuário atual
                const { data, error: erroUsuario } = await supabase
                    .from('check_ins')
                    .select('*')
                    .eq('dispositivo_id', meuDispositivoId)
                    .eq('status', 'ACTIVE');
                    
                if (erroUsuario) throw erroUsuario;

                if (data && data.length > 0) {
                    btnEntrar.style.display = 'none';
                    btnSair.style.display = 'block';
                } else {
                    btnEntrar.style.display = 'block';
                    btnSair.style.display = 'none';
                }
            } catch (erro) {
                console.error("Erro no Supabase:", erro.message);
                // Se der erro, mostra no console do navegador para podermos investigar
            }
        }

        // 4. BOTÕES
        btnEntrar.addEventListener('click', async function() {
            btnEntrar.innerText = "Carregando...";
            await supabase.from('check_ins').insert([
                { dispositivo_id: meuDispositivoId, status: 'ACTIVE' }
            ]);
            btnEntrar.innerText = "FAZER CHECK-IN";
            carregarDados();
        });

        btnSair.addEventListener('click', async function() {
            btnSair.innerText = "Carregando...";
            await supabase.from('check_ins')
                .update({ status: 'COMPLETED' })
                .eq('dispositivo_id', meuDispositivoId)
                .eq('status', 'ACTIVE');
            btnSair.innerText = "ENCERRAR TREINO";
            carregarDados();
        });

        // 5. INICIAR
        carregarDados();
        
        // Mantém a tela atualizada para ver outras pessoas entrando
        setInterval(carregarDados, 5000);
    </script>
</body>
</html>
